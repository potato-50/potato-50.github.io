<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RandomStuff</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        nav { font-weight: bold; background-color: #333; display: flex; justify-content: flex-end; align-items: center; width: 100%; position: relative; }
        nav li { font-weight: bold; position: relative; list-style-type: none; }
        nav a, nav li a { font-weight: bold; display: block; color: white; text-align: center; padding: 14px 16px; text-decoration: none; transition: 0.3s; }
        nav a:hover, nav li a:hover { font-weight: bold; background-color: #111; transition: 0.3s; color: lightgrey; }
        .welcome { text-align: center; padding: 50px; }
        .welcome h1 { margin-bottom: 10px; }
        .welcome p { margin-bottom: 20px; }
        .menu-button { width: auto; display: flex; flex-direction: column; padding: 10px 20px; background-color: #333; color: white; text-decoration: none; transition: 0.3s; border-radius: 5px; font-weight: bold; }
        .menu-button:hover { box-shadow: 0 4px 8px black; background-color: #111; transition: 0.3s; transform: translateY(-5px); }
        .grid { display: flex; gap: 15px; align-items: center; justify-content: center; text-decoration: none; }
        .dropdown-menu { position: absolute; top: 100%; left: 0; background-color: #333; min-width: 75px; z-index: 100; text-align: left; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .dropdown-menu.menu-left { left: auto; right: 0; }
        .dropdown-menu.show { opacity: 1; visibility: visible; }
        nav div li a.home { font-weight: bold; color: lightgrey; }
        .nav-links-wrapper { display: flex; flex-direction: row-reverse; list-style-type: none; margin: 0; padding: 0; }
    </style>
</head>
<body>
<nav>
    <div class="nav-links-wrapper">
      <li class="nav-section">
        <a href="menu.html">Menu</a>
        <div class="dropdown-menu menu-left">
          <a href="menu/games.html">Games</a>
          <a href="menu/other.html">Other</a>
        </div>
      </li>
      <li class="nav-section">
        <a class="home" href="index.html">Home</a>
      </li>
    </div>
</nav>

<section class="welcome">
        <h1>Welcome to Random Stuff</h1>
        <div class="grid">
            <a class="menu-button" href="menu.html">View Projects</a>
        </div>
</section>

  <script>
    document.querySelectorAll('.nav-section').forEach(el => {
      const menu = el.querySelector('.dropdown-menu');
      el.addEventListener('mouseenter', () => menu.classList.add('show'));
      el.addEventListener('mouseleave', () => menu.classList.remove('show'));
    });
  </script>
</body>
</html>
