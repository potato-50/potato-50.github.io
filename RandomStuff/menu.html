<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta description="minecraftwolf123456's Scratch Projects">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RandomStuff - Menu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        nav { font-weight: bold; background-color: #333; display: flex; justify-content: flex-end; align-items: center; width: 100%; position: relative; }
        nav li { font-weight: bold; position: relative; list-style-type: none; }
        nav a, nav li a { font-weight: bold; display: block; color: white; text-align: center; padding: 14px 16px; text-decoration: none; transition: 0.3s; }
        nav a:hover, nav li a:hover { font-weight: bold; background-color: #111; transition: 0.3s; color: lightgrey; }
        nav li a.menu { font-weight: bold; color: lightgrey; }
        .title { text-align: center; padding: 50px; }
        .title h1 { margin-bottom: 10px; }
        .title p { margin-bottom: 20px; }
        .title a { display: inline-block; padding: 10px 20px; background-color: #333; color: white; text-decoration: none; transition: 0.3s; border-radius: 5px; }
        .title a:hover { background-color: #111; transition: 0.3s;}
        .dropdown-menu { position: absolute; top: 100%; left: 0; background-color: #333; min-width: 100%; z-index: 100; text-align: left; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .dropdown-menu.menu-left { left: auto; right: 0; }
        .dropdown-menu.show { opacity: 1; visibility: visible; }
        nav div li a.menu { font-weight: bold; color: lightgrey; }
        .nav-links-wrapper { display: flex; flex-direction: row-reverse; list-style-type: none; margin: 0; padding: 0; }
        .grid { display: flex; grid-template-columns: repeat(auto-fill, minmax(none, 1fr)); gap: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { width: auto; text-align: center; border: none; padding: 0; border-radius: 5px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer }
        .card a { display: flex; flex-direction: column; padding: 10px 20px; background-color: #333; color: white; text-decoration: none; transition: 0.3s; border-radius: 5px; font-weight: bold; }
        .card a:hover { box-shadow: 0 4px 8px black; background-color: #111; transition: 0.3s; transform: translateY(-5px); }
        .gridb { display: flex; gap: 15px; align-items: center; justify-content: center; text-decoration: none; }
        </style>
</head>
<body>
<nav>
    <div class="nav-links-wrapper">
      <li class="nav-section">
        <a class="menu" href="menu.html">Menu</a>
        <div class="dropdown-menu menu-left">
          <a href="menu/games.html">Games</a>
          <a href="menu/other.html">Other</a>
        </div>
      </li>
      <li class="nav-section">
        <a class="home" href="index.html">Home</a>
      </li>
    </div>
</nav>
<h1 class="title">Menu</h1>
<section class="cards">
  <div class="grid">
    <div class="card">
      <a href="menu/games.html">
        <h2>Games</h2>
      </a>
    </div>
    <div class="card">
      <a href="menu/other.html">
        <h2>Other</h2>
      </a>
    </div>
  </div>
  <div class="gridb">
    <a href="menu/games.html">
      <h2>Games</h2>
    </a>
    <a href="menu/other.html">
      <h2>Other</h2>
    </a>
  </div>
</section>
<script>
    document.querySelectorAll('.nav-section').forEach(el => {
      const menu = el.querySelector('.dropdown-menu');
      el.addEventListener('mouseenter', () => menu.classList.add('show'));
      el.addEventListener('mouseleave', () => menu.classList.remove('show'));
    });
</script>
</body>
</html>
